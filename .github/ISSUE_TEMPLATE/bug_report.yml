name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '…'
        2. Click '…'
        3. See the error
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      description: Where did this happen?
      options:
        - Desktop (cursor + keyboard)
        - Phone (touch)
        - Tablet (touch)
        - TV (remote / D-pad)
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / OS
      placeholder: e.g. Safari 18 on iOS 18, Chrome on Windows, Tizen on a Samsung TV
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, console errors, the artwork id or URL, etc.
