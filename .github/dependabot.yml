version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Batch routine minor/patch bumps into one PR to cut noise.
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Never auto-open major-version PRs. A batch of unrelated major bumps
    # (Next, Tailwind, TypeScript) once landed together and broke the build;
    # majors now require a deliberate, tested migration initiated by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
